:middle;margin-right:4px}.dot.uk{background:var(--uk)}.dot.us{background:var(--us)}@media(max-width:600px){.controls-in{grid-template-columns:minmax(0,1fr) 84px}.rate{grid-column:1/-1;height:34px;justify-content:center}.rate button{padding:5px 10px}main{margin-top:12px;padding:0 7px}.row{grid-template-columns:43% 57%;min-height:68px}.cell{padding:12px 9px 17px}.ja{font-size:12.5px;line-height:1.65}.en{font-size:13.2px;line-height:1.55}.help{font-size:9.5px}.help>div{padding:8px}}

<header><div class="head"><div class="kicker">Aozora × Modern British English</div><h1>文学英語・音声リーダー <span style="font-size:.45em;color:#e8d4a4">BETA</span></h1><p class="lead">2列をそのまま縦に読む。日本語を押すと対応する英文全文、英語を押すと太字チャンクだけを再生。どちらのセルも左70%は英国、右30%は米国アクセント。</p></div></header>

const DATA=[{id:"melos",icon:"🏃",title:"走れメロス",enTitle:"Run, Melos!",sections:[{id:"001",rows:[["メロスは激怒した。","Melos was furious.",[]],["必ず、かの邪智暴虐の王を除かなければならぬと決意した。","He decided that something had to be done about the cruel and ruthless king.",["something had to be done about"]],["メロスには政治がわからぬ。","Melos knew very little about politics.",["knew very little about"]],["笛を吹き、羊と遊んで暮して来た。","He spent his days playing the flute and tending his sheep.",["spent his days"]],["けれども邪悪に対しては、人一倍に敏感であった。","But he was particularly sensitive to wrongdoing.",["particularly sensitive to"]],["この妹は、村の或る律気な一牧人を、近々、花婿として迎える事になっていた。","His sister was due to marry an honest young shepherd from the village.",["was due to marry"]],["結婚式も間近かなのである。","The wedding was fast approaching.",["was fast approaching"]],["メロスは、それゆえ、花嫁の衣裳やら祝宴の御馳走やらを買いに、はるばる市にやって来たのだ。","That was why Melos had come all the way to the city to buy her wedding clothes and food for the celebration.",["That was why"]],["久しく逢わなかったのだから、訪ねて行くのが楽しみである。","They had not seen each other for a long time, so he was looking forward to seeing him.",["was looking forward to seeing him"]],["歩いているうちにメロスは、まちの様子を怪しく思った。","As he walked, Melos began to feel that something was wrong with the town.",["something was wrong with"]],["もう既に日も落ちて、まちの暗いのは当りまえだが、けれども、なんだか、夜のせいばかりでは無く、市全体が、やけに寂しい。","The sun had already set, so of course the town was dark, but there seemed to be more to it than that; the whole place felt strangely deserted.",["there seemed to be more to it than that"]],["のんきなメロスも、だんだん不安になって来た。","Even the easy-going Melos gradually began to feel uneasy.",["began to feel uneasy"]],["路で逢った若い衆をつかまえて、何かあったのか、と質問した。","He stopped a young man in the street and asked whether anything had happened.",["whether anything had happened"]],["しばらく歩いて老爺に逢い、こんどはもっと、語勢を強くして質問した。","After walking a little further, he met an old man and asked the same question again, this time in a firmer tone.",["in a firmer tone"]],["メロスは両手で老爺のからだをゆすぶって質問を重ねた。","Melos took him by the shoulders and pressed him for an answer.",["pressed him for an answer"]]]}]},{id:"tono",icon:"⛰️",title:"遠野物語",enTitle:"Tales of Tono",sections:[{id:"001",rows:[["この話はすべて遠野の人佐々木鏡石君より聞きたり。","All of these stories were told to me by Kyoseki Sasaki, a man from Tono.",["were told to me by"]],["昨明治四十二年の二月ごろより始めて夜分おりおり訪ね来たりこの話をせられしを筆記せしなり。","From around February last year, 1909, he would visit me from time to time in the evening, and I wrote down what he told me.",["wrote down what he told me"]],["自分もまた一字一句をも加減せず感じたるままを書きたり。","I, too, wrote down what I heard without adding or taking anything away, exactly as it struck me.",["without adding or taking anything away"]],["我々はより多くを聞かんことを切望す。","We are eager to hear more.",["eager to hear more"]],["古き売買譲与の証文には常に見ゆる所なり。","They regularly appear in old documents recording sales and transfers of land.",["regularly appear in"]],["村人の永住の地を去らんとする者とかりそめに入りこみたる旅人とまたかの悠々たる霊山とを黄昏は徐に来たりて包容し尽したり。","Twilight slowly came and seemed to take in everything: the villagers, the traveller and the great sacred mountains beyond.",["seemed to take in everything"]],["思うにこの類の書物は少なくも現代の流行にあらず。","Books of this kind are, I think, hardly in fashion today.",["hardly in fashion today"]]]}]},{id:"rashomon",icon:"⛩️",title:"羅生門",enTitle:"Rashomon",sections:[{id:"001",rows:[["ある日の暮方の事である。","It was towards evening one day.",[]],["一人の下人が、羅生門の下で雨やみを待っていた。","A servant was waiting under Rashomon Gate for the rain to stop.",[]],["そこで洛中のさびれ方は一通りではない。","As a result, the city had fallen into serious decline.",[]],["洛中がその始末であるから、羅生門の修理などは、元より誰も捨てて顧る者がなかった。","With the city in that condition, no one was going to make repairing Rashomon a priority.",["make repairing Rashomon a priority"]],["しかし、下人は雨がやんでも、格別どうしようと云う当てはない。","In fact, even if it stopped raining, he had no particular plan for what to do next.",["had no particular plan for what to do next"]],["所がその主人からは、四五日前に暇を出された。","But four or five days earlier, he had been dismissed.",["had been dismissed"]],["だから「下人が雨やみを待っていた」と云うよりも「雨にふりこめられた下人が、行き所がなくて、途方にくれていた」と云う方が、適当である。","So it would be more accurate to say that, trapped by the rain and with nowhere to go, he did not know what to do with himself.",["did not know what to do with himself"]]]},{id:"002",rows:[["どうにもならない事を、どうにかするためには、手段を選んでいる暇はない。","If he was going to deal with a situation that seemed impossible, he could not afford to be too particular about his methods.",["could not afford to be too particular about his methods"]],["しかしこの「すれば」は、いつまでたっても、結局「すれば」であった。","But that “if” remained an “if”; he still could not turn it into a decision.",[]],["下人は、手段を選ばないという事を肯定しながらも…勇気が出ずにいたのである。","He could accept in principle that he had no room to be selective, but he could not bring himself to accept the logical next step: that he had no choice but to become a thief.",["could not bring himself to accept the logical next step"]],["下人は、始めから、この上にいる者は、死人ばかりだと高を括っていた。","From the beginning, the servant had taken it for granted that only the dead would be above the gate.",["taken it for granted that"]],["この雨の夜に、この羅生門の上で、火をともしているからは、どうせただの者ではない。","Anyone lighting a fire above Rashomon on a night like this was clearly no ordinary person.",["no ordinary person"]]]},{id:"003",rows:[["この時、誰かがこの下人に…恐らく下人は、何の未練もなく、飢死を選んだ事であろう。","If someone had now put the earlier question to him again—starve or become a thief—he would probably have chosen starvation without a second thought.",["without a second thought"]],["従って、合理的には、それを善悪のいずれに片づけてよいか知らなかった。","Strictly speaking, he did not have enough information to judge whether what she was doing was right or wrong.",["did not have enough information to judge"]],["しかし下人にとっては…それだけで既に許すべからざる悪であった。","But from his point of view, pulling hair from a corpse above Rashomon on a rainy night was already, in itself, an unforgivable wrong.",["from his point of view"]]]},{id:"004",rows:[["しかし勝敗は、はじめからわかっている。","The outcome, however, was never really in doubt.",["was never really in doubt"]],["だからお前に縄をかけて、どうしようと云うような事はない。","So I have no intention of handing you over or tying you up.",["have no intention of handing you over"]],["せねば、飢死をするのじゃて、仕方がなくした事であろ。","She did it because otherwise she would have starved; under the circumstances, she had no real alternative.",["under the circumstances","had no real alternative"]],["これとてもやはりせねば、飢死をするじゃて、仕方がなくする事じゃわいの。","If I don't do this, I will starve too, so I have little choice but to do it.",["have little choice but to do it"]],["じゃて、その仕方がない事を…大目に見てくれるであろ。","And since this woman understood what it means to have no choice, she would probably turn a blind eye to what I'm doing.",["turn a blind eye to what I'm doing"]]]},{id:"005",rows:[["「きっと、そうか。」","“Are you sure that's how you see it?”",[]],["老婆の話が完ると、下人は嘲るような声で念を押した。","When the old woman had finished, the servant pressed her for confirmation, his voice openly mocking.",["pressed her for confirmation"]],["己もそうしなければ、飢死をする体なのだ。","The same applies to me: if I don't do this, I'll starve.",["The same applies to me"]],["下人の行方は、誰も知らない。","No one knows what became of the servant.",[]]]}]},{id:"overcoat",icon:"🧥",title:"外套",enTitle:"The Overcoat",sections:[{id:"005",rows:[["アカーキイ・アカーキエウィッチは…けっして二ルーブルより多くは払うまいと肚をきめた。","Akaky Akakievich was already wondering how much the tailor would charge and set himself a firm limit of two roubles.",["set himself a firm limit"]],["そんな場合にはたいてい、ペトローヴィッチは…進んで値を引いたり…","Petrovich was usually generous, willing to reduce the price and much more open to what his customers wanted.",["willing to reduce the price"]],["それと悟ると…いわゆる出直そうと考えた…","Realising this, Akaky Akakievich considered coming back another time, but it was already too late.",["coming back another time"]],["大して手間ひまのかかる仕事じゃない…","That's all. It shouldn't be a major job.",["shouldn't be a major job"]],["ペトローヴィッチは…長いことあちらこちら調べていた。","Petrovich took the coat, spread it on the table and carried out a careful inspection.",["carried out a careful inspection"]],["なにしろ土台が大事ですからねえ。","The underlying structure is the key problem.",["The underlying structure is the key problem"]],["「どうして、新調するなんて？　わしにそんな金があるものか。」","“A new one? How could I possibly afford that?”",["How could I possibly afford that"]],["「まあ、百五十ルーブルはたっぷりかかりますなあ。」","“You would be looking at around a hundred and fifty roubles.”",["You would be looking at around"]]]},{id:"006",rows:[["「いや、駄目なことですよ。どうせ骨折り損の銭うしないってことにしきゃなりませんから。」","“It would be pointless. You would only spend money without solving the problem.”",["spend money without solving the problem"]],["「おれは、ほんとに、まさかこんなことになろうとは思いもよらなかったわい……。」","“I honestly never expected things to come to this.”",["never expected things to come to this"]],["ここで初めて彼は自分の考えをまとめにかかり…","At last, he began to organise his thoughts, recognise the reality of his position and consider the problem systematically.",["organise his thoughts"]],["だが実際のところ、いったい何を当てに、どういう金でそれを新調したものだろう？","But the practical question remained: where was the money going to come from?",["where was the money going to come from"]],["その金はもうとっくから、前もって使い途の割り当てがついていた。","That money had already been allocated to other expenses.",["been allocated to other expenses"]],["しかし、あとの半分はどこから工面するのだ？","But how could he make up the shortfall?",["make up the shortfall"]],["一ルーブルつかうごとに二カペイカ銅貨を…箱へ抛り込んでおく習慣があった。","He had long had the habit of setting aside two kopecks every time he spent a rouble.",["setting aside"]]]},{id:"011",rows:[["彼は事件の要点にはいっこう注意を向けないで…","Instead of focusing on the key issue, he questioned why Akaky Akakievich had been out so late.",["focusing on the key issue"]],["外套の一件が適当な措置をとられるものやらどうやら…","Akaky Akakievich left with no idea whether any appropriate action would be taken.",["any appropriate action would be taken"]],["早速、彼のために義捐金を集めることに話がきまった。","They quickly agreed to raise some money for him.",["raise some money for him"]],["法律的な証拠を提出しないかぎり…","He might still have to provide legal proof of ownership.",["provide legal proof of ownership"]],["その有力な人物なら、あちこち適当な方面と連絡をとって…","Such a person could contact the relevant authorities and help ensure that the case was handled properly.",["contact the relevant authorities"]]]},{id:"012",rows:[["他人の目から見ればいっこう重要でもなんでもない地位を自分ではさもたいそうらしく思いこんでいる…","There are always people who attach great importance to a position that others regard as fairly minor.",["attach great importance to a position"]],["恐ろしく厳格な順序を踏んで…最後にやっと用件が彼のところへ到達する…","There was a rigid chain of command, and only then could the matter reach him.",["chain of command"]],["「ああ！　待たせておけ、今は忙がしいんだから。」","“Fine. Keep him waiting. I'm busy at the moment.”",["Keep him waiting"]]]},{id:"013",rows:[["御斡旋をねがって…しかるべき筋と打合わせて…","He said he had come to ask for help in coordinating with the appropriate authorities so that the coat might be recovered.",["coordinating with the appropriate authorities"]],["こういう場合にはまず第一、事務課へ願書を提出すべきじゃ。","In a case like this, you must first submit a formal request to the administrative office.",["submit a formal request to the administrative office"]],["秘書官などと申しまするものは…まったく当てにならない連中でございますからで…","The reason I came directly to you is that the secretaries are… well… not entirely reliable.",["not entirely reliable"]]]},{id:"015",rows:[["一週間ほど後…あの男はどうしたろう…それを知るために下役を出むかせた…","About a week later, still concerned, he sent a junior member of staff to find out what had happened and whether any assistance could still be offered.",["find out what had happened"]],["彼は少しでも心をまぎらして…夜会へ出かけていった。","Hoping to take his mind off the matter, he went to an evening gathering at a friend's house.",["take his mind off the matter"]],["この出来事は彼に強い感銘を与えた。","The incident had a lasting effect on him.",["had a lasting effect on him"]],["もし浴びせたにしても、それはまず、事の顛末をいちおう聴取してからであった。","And if he did reprimand someone, he would first hear the full circumstances.",["hear the full circumstances"]]]}]}];
const els={work:document.getElementById("workSelect"),section:document.getElementById("sectionSelect"),content:document.getElementById("content"),toast:document.getElementById("toast")};let rate=1,voices=[],toastTimer=null;function loadVoices(){voices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}if("speechSynthesis" in window){loadVoices();speechSynthesis.addEventListener?.("voiceschanged",loadVoices)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function markChunks(text,chunks){let out=esc(text);[...chunks].sort((a,b)=>b.length-a.length).forEach(chunk=>{const safe=esc(chunk),i=out.indexOf(safe);if(i>=0)out=out.slice(0,i)+"<strong>"+safe+"</strong>"+out.slice(i+safe.length)});return out}function chooseVoice(lang){loadVoices();const exact=voices.filter(v=>String(v.lang).toLowerCase().startsWith(lang.toLowerCase()));const preferred=lang==="en-GB"?["Daniel","Serena","Kate","Oliver","Google UK","English (United Kingdom)"]:["Samantha","Alex","Ava","Tom","Google US","English (United States)"];for(const name of preferred){const v=exact.find(x=>x.name.includes(name));if(v)return v}return exact[0]||null}function accentFromEvent(ev,cell){const r=cell.getBoundingClientRect();return((ev.clientX-r.left)/r.width)<=.70?"en-GB":"en-US"}function showToast(msg){clearTimeout(toastTimer);els.toast.textContent=msg;els.toast.classList.add("show");toastTimer=setTimeout(()=>els.toast.classList.remove("show"),1050)}function speak(text,lang,cell,kind){if(!("speechSynthesis" in window)){showToast("このブラウザは音声再生に未対応です");return}if(!text){cell.classList.remove("no-chunk");void cell.offsetWidth;cell.classList.add("no-chunk");showToast("太字チャンクなし — 再生しません");return}speechSynthesis.cancel();document.querySelectorAll(".cell.play-uk,.cell.play-us").forEach(x=>x.classList.remove("play-uk","play-us"));cell.classList.add(lang==="en-GB"?"play-uk":"play-us");const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.pitch=1;const voice=chooseVoice(lang);if(voice)u.voice=voice;u.onend=()=>cell.classList.remove("play-uk","play-us");u.onerror=()=>cell.classList.remove("play-uk","play-us");speechSynthesis.speak(u);showToast((lang==="en-GB"?"🇬🇧 UK":"🇺🇸 US")+" · "+kind)}function currentWork(){return DATA.find(w=>w.id===els.work.value)||DATA[0]}function fillSections(){const w=currentWork();els.section.innerHTML=w.sections.map(s=>`<option value="${s.id}">${s.id}</option>`).join("");const saved=localStorage.getItem("lit-section-"+w.id);if(w.sections.some(s=>s.id===saved))els.section.value=saved;render()}function render(){const w=currentWork(),s=w.sections.find(x=>x.id===els.section.value)||w.sections[0];localStorage.setItem("lit-work",w.id);localStorage.setItem("lit-section-"+w.id,s.id);els.content.innerHTML=`<div class="section-title"><h2>${w.icon} ${esc(w.title)} <span style="font-family:Georgia;color:#8b7650">· ${esc(w.enTitle)}</span></h2><span>${s.id} · ${s.rows.length} rows</span></div><div class="reader">${s.rows.map((r,i)=>`<div class="row" data-row="${i}"><div class="cell ja" tabindex="0" role="button" aria-label="日本語。押すと英語全文を再生">${esc(r[0])}</div><div class="cell en" tabindex="0" role="button" aria-label="英語。押すと太字チャンクのみ再生">${markChunks(r[1],r[2])}</div></div>`).join("")}</div>`;els.content.querySelectorAll(".row").forEach((row,i)=>{const r=s.rows[i],ja=row.querySelector(".ja"),en=row.querySelector(".en");const act=(cell,kind,ev)=>{const lang=accentFromEvent(ev,cell);if(kind==="full")speak(r[1],lang,cell,"全文");else speak(r[2].join(". "),lang,cell,"チャンク")};ja.addEventListener("click",e=>act(ja,"full",e));en.addEventListener("click",e=>act(en,"chunk",e));ja.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();speak(r[1],"en-GB",ja,"全文")}});en.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();speak(r[2].join(". "),"en-GB",en,"チャンク")}})})}els.work.innerHTML=DATA.map(w=>`<option value="${w.id}">${w.icon} ${w.title}｜${w.enTitle}</option>`).join("");const savedWork=localStorage.getItem("lit-work");if(DATA.some(w=>w.id===savedWork))els.work.value=savedWork;els.work.addEventListener("change",fillSections);els.section.addEventListener("change",render);document.querySelectorAll(".rate button").forEach(b=>b.addEventListener("click",()=>{rate=Number(b.dataset.rate);document.querySelectorAll(".rate button").forEach(x=>x.classList.toggle("active",x===b))}));fillSections();
