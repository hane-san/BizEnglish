  const behaviour=`<script>(function(){

let scrollTimer=null;
function currentKey(){const w=document.getElementById('workSelect');const s=document.getElementById('sectionSelect');return SCROLL_PREFIX+(w?.value||'')+':'+(s?.value||'');}

function restoreScroll(){const saved=Number(localStorage.getItem(currentKey())||0);requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,saved)));}
function afterRender(){numberRows();}
const observer=new MutationObserver(()=>afterRender());
window.addEventListener('DOMContentLoaded',()=>{
 const content=document.getElementById('content');if(content)observer.observe(content,{childList:true,subtree:true});

});
