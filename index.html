ence":3,"key":"G32","unitTitle":"エコー疑問","japanese":"「追加公演が発表されました」「そうなんですか？」","english":"“They've added another date.” “Have they?”","ordinal":429},{"id":"t-214","domain":"travel","domainLabel":"旅行・文化","set":12,"unit":72,"setUnit":12,"sentence":1,"key":"G36","unitTitle":"強調の do","japanese":"いくつか欠点は確かにありますが、その作品は自信を持ってお勧めできます。","english":"The film does have a few flaws, but I can recommend it with confidence.","ordinal":430},{"id":"t-215","domain":"travel","domainLabel":"旅行・文化","set":12,"unit":72,"setUnit":12,"sentence":2,"key":"G36","unitTitle":"強調の do","japanese":"その町を訪れるなら、ぜひガイド付き散策に参加してください。","english":"If you visit the town, do take the guided walk.","ordinal":431},{"id":"t-216","domain":"travel","domainLabel":"旅行・文化","set":12,"unit":72,"setUnit":12,"sentence":3,"key":"G36","unitTitle":"強調の do","japanese":"公演全体が好きだったわけではありませんが、アコースティック部分は本当に楽しみました。","english":"I didn't love the whole concert, but I did enjoy the acoustic section.","ordinal":432}];
    const STORAGE_KEY = "british-english-listening-432-v1";
    const ACCENTS = {
      GB: { flag: "🇬🇧", label: "イギリス", lang: "en-GB" },
      US: { flag: "🇺🇸", label: "アメリカ", lang: "en-US" },
      IN: { flag: "🇮🇳", label: "インド", lang: "en-IN" }
    };

    function loadState() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (_) {}
      return {
        mode: saved.mode === "random" ? "random" : "sequential",
        scope: ["all", "business", "travel"].includes(saved.scope) ? saved.scope : "all",
        accent: ["GB", "US", "IN"].includes(saved.accent) ? saved.accent : "GB",
        speed: [0.85, 1, 1.15].includes(Number(saved.speed)) ? Number(saved.speed) : 1,
        index: Number.isInteger(saved.index) && saved.index >= 0 ? saved.index : 0,
        randomIds: Array.isArray(saved.randomIds) ? saved.randomIds : [],
        completedIds: Array.isArray(saved.completedIds) ? saved.completedIds : []
      };
    }

    function shuffle(items) {
      const ids = items.map(item => item.id);
      for (let i = ids.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      return ids;
    }

    const state = loadState();
    const completed = new Set(state.completedIds);
    const itemById = new Map(SENTENCES.map(item => [item.id, item]));
    let revealed = false;
    let voices = [];
    let speechState = "idle";

    const el = {
      routeText: document.getElementById("routeText"),
      completedCount: document.getElementById("completedCount"),
      completedSuffix: document.getElementById("completedSuffix"),
      studyProgress: document.querySelector("#studyProgress span"),
      studyProgressWrap: document.getElementById("studyProgress"),
      card: document.getElementById("sentenceCard"),
      domainBadge: document.getElementById("domainBadge"),
      unitCode: document.getElementById("unitCode"),
      grammarLabel: document.getElementById("grammarLabel"),
      japanese: document.getElementById("japanesePrompt"),
      revealLabel: document.getElementById("revealLabel"),
      tapInvitation: document.getElementById("tapInvitation"),
      tapVoiceLabel: document.getElementById("tapVoiceLabel"),
      revealedAnswer: document.getElementById("revealedAnswer"),
      english: document.getElementById("englishAnswer"),
      equaliser: document.getElementById("equaliser"),
      audioStatus: document.getElementById("audioStatusText"),
      voiceNote: document.getElementById("voiceNoteText"),
      shuffle: document.getElementById("shuffleButton"),
      previous: document.getElementById("previousButton"),
      next: document.getElementById("nextButton"),
      positionNow: document.getElementById("positionNow"),
      positionTotal: document.getElementById("positionTotal"),
      positionCounter: document.getElementById("positionCounter"),
      positionFill: document.getElementById("positionFill"),
      reset: document.getElementById("resetButton")
    };

    function scopedItems() {
      return state.scope === "all" ? SENTENCES : SENTENCES.filter(item => item.domain === state.scope);
    }

    function orderedItems() {
      const scoped = scopedItems();
      if (state.mode === "sequential") return scoped;
      const allowed = new Set(scoped.map(item => item.id));
      const valid = state.randomIds.filter(id => allowed.has(id)).map(id => itemById.get(id)).filter(Boolean);
      if (valid.length !== scoped.length) {
        state.randomIds = shuffle(scoped);
        return state.randomIds.map(id => itemById.get(id));
      }
      return valid;
    }

    function currentItem() {
      const items = orderedItems();
      state.index = Math.min(Math.max(0, state.index), Math.max(0, items.length - 1));
      return { item: items[state.index], items };
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        mode: state.mode,
        scope: state.scope,
        accent: state.accent,
        speed: state.speed,
        index: state.index,
        randomIds: state.randomIds,
        completedIds: [...completed]
      }));
    }

    function scoreVoice(voice, accent) {
      const language = (voice.lang || "").toLowerCase();
      const name = (voice.name || "").toLowerCase();
      const desired = "en-" + accent.toLowerCase();
      let score = 0;
      if (language === desired) score += 100;
      if (language.startsWith(desired)) score += 90;
      if (language.startsWith("en")) score += 20;
      if (/natural|neural|premium|enhanced/.test(name)) score += 8;
      if (/google|microsoft|apple/.test(name)) score += 4;
      if (accent === "GB" && /british|united kingdom|england|uk english/.test(name)) score += 30;
      if (accent === "US" && /american|united states|us english/.test(name)) score += 30;
      if (accent === "IN" && /indian|india|हिन्दी/.test(name)) score += 30;
      return score;
    }

    function bestVoice(accent) {
      return voices.filter(voice => (voice.lang || "").toLowerCase().startsWith("en"))
        .sort((a, b) => scoreVoice(b, accent) - scoreVoice(a, accent))[0];
    }

    function renderSpeech() {
      const config = ACCENTS[state.accent];
      el.card.classList.toggle("speaking", speechState === "speaking");
      el.equaliser.classList.toggle("active", speechState === "speaking");
      el.audioStatus.textContent = speechState === "unsupported"
        ? "このブラウザでは音声再生を利用できません"
        : speechState === "speaking"
          ? config.flag + " " + config.label + "英語を再生中"
          : config.flag + " カードをもう一度タップしてリプレイ";
    }

    function renderVoiceNote() {
      const config = ACCENTS[state.accent];
      const voice = bestVoice(state.accent);
      if (!voices.length) {
        el.voiceNote.textContent = "端末の標準英語音声を使用します";
        return;
      }
      const exact = (voice?.lang || "").toLowerCase().startsWith(config.lang.toLowerCase());
      el.voiceNote.textContent = exact
        ? "使用音声：" + voice.name
        : config.label + "音声がないため「" + (voice?.name || "端末の標準音声") + "」で代替します";
    }

    function render() {
      const { item, items } = currentItem();
      const scoped = scopedItems();
      const completedInScope = scoped.filter(entry => completed.has(entry.id)).length;
      const config = ACCENTS[state.accent];
      const scopeLabel = state.scope === "all" ? "全432文" : state.scope === "business" ? "ビジネス216文" : "旅行・文化216文";
      const studyPercent = scoped.length ? completedInScope / scoped.length * 100 : 0;
      const positionPercent = items.length ? (state.index + 1) / items.length * 100 : 0;

      el.routeText.textContent = (state.mode === "sequential" ? "順番通り" : "ランダム") + " · " + scopeLabel;
      el.completedCount.textContent = completedInScope;
      el.completedSuffix.textContent = " / " + scoped.length + " 学習済み";
      el.studyProgress.style.width = studyPercent + "%";
      el.studyProgressWrap.setAttribute("aria-label", "学習進捗 " + Math.round(studyPercent) + "%");
      el.domainBadge.textContent = item.domain === "business" ? "BUSINESS" : "TRAVEL & CULTURE";
      el.domainBadge.className = "domain-badge " + item.domain;
      el.unitCode.textContent = "SET " + String(item.set).padStart(2, "0") + " · UNIT " + String(item.unit).padStart(2, "0") + " · " + item.key + " · " + item.sentence + "/3";
      el.grammarLabel.textContent = item.unitTitle;
      el.japanese.textContent = item.japanese;
      el.english.textContent = item.english;
      el.english.lang = config.lang;
      el.revealLabel.textContent = revealed ? "ENGLISH" : "TAP TO REVEAL & LISTEN";
      el.tapInvitation.hidden = revealed;
      el.revealedAnswer.hidden = !revealed;
      el.tapVoiceLabel.textContent = "英語表示 ＋ " + config.flag + " " + config.label + "英語";
      el.card.classList.toggle("revealed", revealed);
      el.card.setAttribute("aria-label", revealed ? "タップして英語音声をもう一度再生" : "タップして英語を表示し音声を再生");
      el.shuffle.hidden = state.mode !== "random";
      el.previous.disabled = state.index === 0;
      el.next.disabled = state.index >= items.length - 1;
      el.positionNow.textContent = String(state.index + 1).padStart(3, "0");
      el.positionTotal.textContent = String(items.length).padStart(3, "0");
      el.positionCounter.setAttribute("aria-label", (state.index + 1) + "文目、全" + items.length + "文");
      el.positionFill.style.width = positionPercent + "%";

      document.querySelectorAll("[data-mode]").forEach(button => {
        const active = button.dataset.mode === state.mode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      document.querySelectorAll("[data-scope]").forEach(button => {
        const active = button.dataset.scope === state.scope;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      document.querySelectorAll("[data-accent]").forEach(button => {
        const active = button.dataset.accent === state.accent;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      document.querySelectorAll("[data-speed]").forEach(button => {
        const active = Number(button.dataset.speed) === state.speed;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      renderSpeech();
      renderVoiceNote();
      save();
    }

    function cancelSpeech() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      speechState = "idle";
      renderSpeech();
    }

    function speak() {
      const { item } = currentItem();
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        speechState = "unsupported";
        renderSpeech();
        return;
      }
      const config = ACCENTS[state.accent];
      const utterance = new SpeechSynthesisUtterance(item.english);
      const voice = bestVoice(state.accent);
      utterance.lang = config.lang;
      if (voice) utterance.voice = voice;
      utterance.rate = state.speed;
      utterance.pitch = 1;
      utterance.onstart = () => { speechState = "speaking"; renderSpeech(); };
      utterance.onend = () => { speechState = "idle"; renderSpeech(); };
      utterance.onerror = () => { speechState = "idle"; renderSpeech(); };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function revealAndPlay() {
      const { item } = currentItem();
      if (!revealed) {
        revealed = true;
        completed.add(item.id);
        render();
      }
      speak();
    }

    function move(delta) {
      const { items } = currentItem();
      const next = state.index + delta;
      if (next < 0 || next >= items.length) return;
      cancelSpeech();
      state.index = next;
      revealed = false;
      render();
    }

    document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => {
      const next = button.dataset.mode;
      if (next === state.mode) return;
      state.mode = next;
      if (next === "random") state.randomIds = shuffle(scopedItems());
      state.index = 0;
      revealed = false;
      cancelSpeech();
      render();
    }));

    document.querySelectorAll("[data-scope]").forEach(button => button.addEventListener("click", () => {
      const next = button.dataset.scope;
      if (next === state.scope) return;
      state.scope = next;
      if (state.mode === "random") state.randomIds = shuffle(scopedItems());
      state.index = 0;
      revealed = false;
      cancelSpeech();
      render();
    }));

    document.querySelectorAll("[data-accent]").forEach(button => button.addEventListener("click", () => {
      state.accent = button.dataset.accent;
      render();
      if (revealed) speak();
    }));

    document.querySelectorAll("[data-speed]").forEach(button => button.addEventListener("click", () => {
      state.speed = Number(button.dataset.speed);
      render();
      if (revealed) speak();
    }));

    el.shuffle.addEventListener("click", () => {
      state.randomIds = shuffle(scopedItems());
      state.index = 0;
      revealed = false;
      cancelSpeech();
      render();
    });
    el.previous.addEventListener("click", () => move(-1));
    el.next.addEventListener("click", () => move(1));
    el.card.addEventListener("click", revealAndPlay);
    el.card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        event.stopPropagation();
        revealAndPlay();
      }
    });
    el.reset.addEventListener("click", () => {
      if (!window.confirm("学習済みの記録をすべてリセットしますか？")) return;
      completed.clear();
      render();
    });

    window.addEventListener("keydown", event => {
      if (event.target.closest("button, input, select, textarea")) return;
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
      if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        revealAndPlay();
      }
    });

    if ("speechSynthesis" in window) {
      const loadVoices = () => { voices = window.speechSynthesis.getVoices(); renderVoiceNote(); };
      loadVoices();
      window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
      window.setTimeout(loadVoices, 350);
    } else {
      speechState = "unsupported";
    }

    render();
  </script>
